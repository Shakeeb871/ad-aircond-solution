---
# cPanel Git Version Control deployment.
#
# Two layouts are possible and this file handles both.
#
# 1. Repository checked out INSIDE the website folder. cPanel updates the
#    working tree, which IS the live site, so the files are already in place
#    and there is nothing to copy. The guard below detects this and stops.
#    Copying in this layout is not merely redundant, it is destructive:
#    "rm -rf $DEPLOYPATH/assets" would delete the repository's own assets
#    folder and the copy that follows would then have no source.
#
# 2. Repository checked out somewhere separate, e.g.
#    /home/<user>/repositories/adaircond. The tasks copy the built site across
#    into the folder the domain serves from.
#
# DEPLOYPATH is that website folder. For the addon domain adaircondsolution.com
# on this account it is $HOME/adaircondsolution.com. For a primary domain it is
# usually $HOME/public_html.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/adaircondsolution.com
    - export REPOPATH="$(pwd -P)"
    - export LIVEPATH="$(cd "$DEPLOYPATH" 2>/dev/null && pwd -P || echo none)"
    - if [ "$LIVEPATH" = "$REPOPATH" ]; then echo "Repository is the website folder - the working tree is already the live site, nothing to copy."; exit 0; fi
    - /bin/mkdir -p $DEPLOYPATH
    # homepage and the single-file copy
    - /bin/cp -f index.html standalone.html $DEPLOYPATH/
    # every generated page lives at <name>/index.html so the URL is /<name>/
    - /bin/rm -rf $DEPLOYPATH/about $DEPLOYPATH/services $DEPLOYPATH/contact $DEPLOYPATH/ac-repair $DEPLOYPATH/ac-cleaning $DEPLOYPATH/ac-installation $DEPLOYPATH/ac-maintenance $DEPLOYPATH/gas-refilling $DEPLOYPATH/ac-electrical-service
    - /bin/cp -R about services contact ac-repair ac-cleaning ac-installation ac-maintenance gas-refilling ac-electrical-service $DEPLOYPATH/
    # the flat pages this site used before are gone; clear any left on the server
    - /bin/rm -f $DEPLOYPATH/about.html $DEPLOYPATH/services.html $DEPLOYPATH/contact.html $DEPLOYPATH/ac-repair.html $DEPLOYPATH/ac-cleaning.html $DEPLOYPATH/ac-installation.html $DEPLOYPATH/ac-maintenance.html $DEPLOYPATH/gas-refilling.html $DEPLOYPATH/ac-electrical-service.html
    - /bin/cp -f favicon.svg $DEPLOYPATH/
    - /bin/cp -f robots.txt sitemap.xml $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/
    # replace assets wholesale so files removed from the repo also leave the server
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -R assets $DEPLOYPATH/
    - /bin/rm -f $DEPLOYPATH/assets/img/README.md
