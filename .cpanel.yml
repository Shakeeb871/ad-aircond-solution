---
# cPanel Git Version Control deployment.
#
# IMPORTANT: the repository itself must NOT live in the website folder. Clone it
# somewhere separate, e.g. /home/<user>/repositories/adaircond, and these tasks
# copy the files across into the folder the domain serves from.
#
# DEPLOYPATH is that website folder. For the addon domain adaircondsolution.com
# on this account it is $HOME/adaircondsolution.com. If the site is served from
# somewhere else, change this one line — for a primary domain it is usually
# $HOME/public_html.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/adaircondsolution.com
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -f standalone.html $DEPLOYPATH/
    - /bin/cp -f favicon.svg $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/
    # replace assets wholesale so files removed from the repo also leave the server
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -R assets $DEPLOYPATH/
    - /bin/rm -f $DEPLOYPATH/assets/img/README.md
