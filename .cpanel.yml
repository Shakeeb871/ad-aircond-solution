---
# cPanel Git Version Control deployment.
#
# cPanel runs these tasks as your cPanel user, from inside the cloned repository,
# whenever a deployment is triggered (Git Version Control -> Manage -> Deploy HEAD Commit,
# or the `git-deploy` trigger described in README).
#
# DEPLOYPATH is the folder your domain serves from. $HOME expands to /home/<your-cpanel-user>,
# so this works without hardcoding the username. For an addon domain or subdomain, change it,
# e.g. $HOME/adaircondsolution.com or $HOME/public_html/aircond
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -f index.html $DEPLOYPATH/
    - /bin/cp -f favicon.svg $DEPLOYPATH/
    - /bin/cp -f .htaccess $DEPLOYPATH/
    # Replace assets wholesale so files deleted from the repo also disappear from the server.
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/cp -R assets $DEPLOYPATH/
    - /bin/rm -f $DEPLOYPATH/assets/img/README.md
