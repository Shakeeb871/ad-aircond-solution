# Ad Aircond Solution — Apache / cPanel configuration

# ---- Default document ----
# Every page other than the homepage lives at <name>/index.html, so a request
# for /ac-repair/ is served without any rewriting. The rules below only tidy
# up the URLs that should not be used.
DirectoryIndex index.html

# ---- One canonical URL per page ----
# Order matters. The index.html rule runs first, otherwise the .html rule below
# would turn /ac-repair/index.html into /ac-repair/index/.
<IfModule mod_rewrite.c>
  RewriteEngine On

  # ---- Canonical host: https, no www ----
  # One address per page, and it is https://adaircondsolution.com/. These run
  # before the URL-shape rules below so a legacy URL lands on the right host
  # first. Certificate issue and renewal are excluded: AutoSSL and Let's
  # Encrypt fetch /.well-known/acme-challenge/ over plain HTTP.
  RewriteCond %{REQUEST_URI} !^/\.well-known/
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !=https
  RewriteRule ^ https://adaircondsolution.com%{REQUEST_URI} [R=301,L]

  RewriteCond %{REQUEST_URI} !^/\.well-known/
  RewriteCond %{HTTP_HOST} ^www\. [NC]
  RewriteRule ^ https://adaircondsolution.com%{REQUEST_URI} [R=301,L]

  # /ac-repair/index.html and /index.html -> /ac-repair/ and /
  RewriteCond %{THE_REQUEST} "\s/+(.*/)?index\.html[\s?]" [NC]
  RewriteRule ^ /%1 [R=301,L]

  # /ac-repair.html -> /ac-repair/  (the flat URLs this site used before).
  # standalone.html is a real file that must keep its own URL.
  RewriteCond %{REQUEST_URI} !^/standalone\.html$
  RewriteCond %{THE_REQUEST} "\s/+([^\s?]+)\.html[\s?]" [NC]
  RewriteRule ^ /%1/ [R=301,L]

  # /ac-repair -> /ac-repair/  (add the trailing slash on real directories)
  RewriteCond %{REQUEST_FILENAME} -d
  RewriteCond %{REQUEST_URI} !/$
  RewriteRule ^(.*)$ /$1/ [R=301,L]
</IfModule>

# ---- Block repository and source files ----
# On this account the repository is checked out in the website folder itself,
# so .git, the build scripts and the partials all sit next to the pages. None
# of them should be readable over HTTP. These rules are harmless when the
# repository lives elsewhere, so they stay either way.
RedirectMatch 404 /\.git(/|$)
RedirectMatch 404 ^/partials(/|$)
RedirectMatch 404 ^/deploy(/|$)
RedirectMatch 404 ^/\.github(/|$)
<IfModule mod_authz_core.c>
  <DirectoryMatch "/(\.git|\.github|partials|deploy)">
    Require all denied
  </DirectoryMatch>
  <FilesMatch "\.(py|ya?ml|md|lock|sh|conf)$">
    Require all denied
  </FilesMatch>
  <Files ".gitignore">
    Require all denied
  </Files>
</IfModule>
<IfModule !mod_authz_core.c>
  <FilesMatch "\.(py|ya?ml|md|lock|sh|conf)$">
    Order allow,deny
    Deny from all
  </FilesMatch>
</IfModule>

# ---- Correct MIME types ----
# X-Content-Type-Options below is "nosniff", so a stylesheet served with the
# wrong type is refused outright and the page renders unstyled. Declare the
# types explicitly rather than trusting the host's defaults.
<IfModule mod_mime.c>
  AddType text/css                 .css
  AddType application/javascript   .js
  AddType text/html                .html
  AddType image/svg+xml            .svg
  AddType image/webp               .webp
  AddType font/woff2               .woff2
  AddType application/json         .json
  AddType application/manifest+json .webmanifest
  AddType image/x-icon             .ico
  AddType image/png                .png
</IfModule>

# ---- Compression ----
<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml
  AddOutputFilterByType DEFLATE application/javascript application/json
  AddOutputFilterByType DEFLATE image/svg+xml
  # woff2 is already compressed — do not re-compress it.
</IfModule>

# ---- Browser caching ----
# The filenames here are not fingerprinted (styles.css stays styles.css after an
# edit), so CSS, JS and images are only cached briefly and revalidated. Caching
# them for a year would leave visitors on the old design after every update.
# Fonts never change, so they keep the long cache.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresDefault                          "access plus 1 hour"
  ExpiresByType text/html                 "access plus 0 seconds"
  ExpiresByType text/css                  "access plus 1 hour"
  ExpiresByType application/javascript    "access plus 1 hour"
  ExpiresByType image/svg+xml             "access plus 1 day"
  ExpiresByType image/jpeg                "access plus 1 day"
  ExpiresByType image/webp                "access plus 1 day"
  ExpiresByType font/woff2                "access plus 1 year"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(css|js)$">
    Header set Cache-Control "public, max-age=3600, must-revalidate"
  </FilesMatch>
  <FilesMatch "\.(svg|jpg|jpeg|png|webp)$">
    Header set Cache-Control "public, max-age=86400, must-revalidate"
  </FilesMatch>
  <FilesMatch "\.woff2$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>
  # HSTS tells the browser to use https for a year without asking. It is set
  # only on responses that already came over https, so it cannot lock anyone
  # out while the certificate is still being issued. No preload and no
  # includeSubDomains, which keeps it reversible.
  Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS

  Header set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# ---- Force HTTPS ----
# Most hosts (and Cloudflare) already do this. Only uncomment if yours does not,
