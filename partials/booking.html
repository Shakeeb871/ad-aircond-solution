<!-- ============ FINAL CTA + BOOKING ============ -->
<section class="section finale" id="contact">
  <div class="finale__media" aria-hidden="true"></div>
  <div class="wrap finale__inner">
    <div class="booking reveal" data-delay="1">
      <h3 class="booking__title">Request a service visit</h3>
      <p class="booking__note">Fill this in and it opens WhatsApp with your details ready to send. Nothing is stored on this page.</p>
      <form class="booking__form" id="bookingForm" data-wa-form novalidate>
        <div class="field">
          <label for="bName">Your name</label>
          <input id="bName" name="name" type="text" autocomplete="name" placeholder="e.g. Aisyah" required>
        </div>
        <div class="field">
          <label for="bPhone">Contact number</label>
          <input id="bPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="e.g. 012-345 6789" required>
        </div>
        <div class="field">
          <label for="bService">Service needed</label>
          <select id="bService" name="service">
            <option>Aircond repair</option>
            <option>Aircond cleaning</option>
            <option>Aircond installation</option>
            <option>Aircond maintenance</option>
            <option>Gas refilling</option>
            <option>Aircond electrical service</option>
            <option>Not sure yet</option>
          </select>
        </div>
        <div class="field">
          <label for="bArea">Area in KL</label>
          <input id="bArea" name="area" type="text" placeholder="e.g. Titiwangsa, Setapak, Wangsa Maju">
        </div>
        <div class="field field--full">
          <label for="bMsg">What is the unit doing?</label>
          <textarea id="bMsg" name="message" rows="3" placeholder="e.g. Two wall units in a condo, one blows warm air and drips water."></textarea>
        </div>
        <p class="booking__error" role="alert" hidden>Please add your name and a contact number.</p>
        <button class="btn btn--primary btn--block btn--lg" type="submit">
          <svg class="ico" aria-hidden="true"><use href="#i-whatsapp"></use></svg>Send via WhatsApp
        </button>
        <p class="booking__alt">Prefer to talk? Call <a href="tel:+60178570744">+60 17-857 0744</a>.</p>
      </form>
    </div>
  </div>
</section>

</main>
