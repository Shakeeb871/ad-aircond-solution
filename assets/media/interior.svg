<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Split air conditioner cooling a modern living room with a Kuala Lumpur skyline view">
  <defs>
    <linearGradient id="iWall" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#eaf7f9"/><stop offset="1" stop-color="#cfe7ec"/></linearGradient>
    <linearGradient id="iAccent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f8ea0"/><stop offset="1" stop-color="#0b6577"/></linearGradient>
    <linearGradient id="iUnit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3e7ec"/></linearGradient>
    <linearGradient id="iFlow" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#5ce6dc" stop-opacity="0.9"/><stop offset="1" stop-color="#5ce6dc" stop-opacity="0"/></linearGradient>
    <linearGradient id="iSofa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d7a8d"/><stop offset="1" stop-color="#07505f"/></linearGradient>
    <linearGradient id="iSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff0f7"/><stop offset="1" stop-color="#7fd8e4"/></linearGradient>
    <linearGradient id="iFloorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7d6dd"/><stop offset="1" stop-color="#93bcc6"/></linearGradient>
    <radialGradient id="iCool" cx="0.3" cy="0.24" r="0.46"><stop offset="0" stop-color="#7ff0e4" stop-opacity="0.55"/><stop offset="1" stop-color="#7ff0e4" stop-opacity="0"/></radialGradient>
    <filter id="iSoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="1000" fill="url(#iWall)"/>
  <!-- deeper accent wall behind the unit -->
  <path d="M0 0h620v760H0z" fill="url(#iAccent)" opacity="0.14"/>
  <rect y="760" width="1200" height="240" fill="url(#iFloorG)"/>
  <path d="M0 760h1200v6H0z" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="360" cy="250" rx="470" ry="330" fill="url(#iCool)"/>

  <!-- window with KL skyline -->
  <g>
    <rect x="716" y="116" width="392" height="480" rx="14" fill="url(#iSky)"/>
    <g fill="#4fb6c8" opacity="0.65">
      <rect x="742" y="380" width="52" height="216"/>
      <rect x="806" y="330" width="38" height="266"/>
      <path d="M868 596V300l22-58 22 58v296z"/>
      <rect x="928" y="356" width="46" height="240"/>
      <rect x="988" y="404" width="60" height="192"/>
      <rect x="1058" y="342" width="34" height="254"/>
    </g>
    <rect x="716" y="116" width="392" height="480" rx="14" fill="none" stroke="#eef8fa" stroke-width="14"/>
    <path d="M912 116v480M716 356h392" stroke="#eef8fa" stroke-width="12"/>
  </g>

  <!-- airflow -->
  <g fill="none" stroke="url(#iFlow)" stroke-linecap="round">
    <path d="M448 286c108 32 208 38 312 20" stroke-width="15"/>
    <path d="M448 336c132 62 268 82 400 62" stroke-width="11" opacity="0.78"/>
    <path d="M448 386c112 92 254 142 386 148" stroke-width="8" opacity="0.55"/>
  </g>

  <!-- indoor split unit -->
  <g>
    <rect x="128" y="206" width="322" height="114" rx="26" fill="#063744" opacity="0.22" filter="url(#iSoft)"/>
    <rect x="122" y="192" width="322" height="114" rx="25" fill="url(#iUnit)"/>
    <rect x="122" y="192" width="322" height="114" rx="25" fill="none" stroke="#9fc4cc" stroke-width="3"/>
    <path d="M146 270h274" stroke="#a9cbd2" stroke-width="5" stroke-linecap="round"/>
    <path d="M154 288h258a16 16 0 0 0 14-23H140a16 16 0 0 0 14 23z" fill="#e0f0f3"/>
    <circle cx="406" cy="234" r="7.5" fill="#14bdb8"/>
    <rect x="152" y="224" width="74" height="10" rx="5" fill="#d3e8ec"/>
  </g>

  <!-- sofa -->
  <g>
    <rect x="150" y="588" width="480" height="36" rx="18" fill="#07505f"/>
    <rect x="160" y="468" width="460" height="136" rx="28" fill="url(#iSofa)"/>
    <rect x="198" y="500" width="184" height="100" rx="18" fill="#12a9bd"/>
    <rect x="400" y="500" width="184" height="100" rx="18" fill="#12a9bd"/>
    <rect x="228" y="522" width="70" height="56" rx="12" fill="#7fe3dc" opacity="0.85"/>
    <path d="M182 624v58M600 624v58" stroke="#063f4c" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- side table + lamp -->
  <g>
    <rect x="676" y="626" width="188" height="17" rx="8" fill="#0c6d80"/>
    <path d="M698 643v46M842 643v46" stroke="#0c6d80" stroke-width="13" stroke-linecap="round"/>
    <circle cx="770" cy="592" r="30" fill="#7fe3dc"/>
    <path d="M752 622h36v8h-36z" fill="#0c6d80"/>
  </g>

  <!-- plant -->
  <g>
    <path d="M1010 760V648" stroke="#0d7a8d" stroke-width="11"/>
    <path d="M1010 676c-48-18-66-64-60-112 48 8 74 52 60 112zM1010 664c48-22 62-70 52-116-48 12-68 56-52 116z" fill="#12a9bd"/>
    <path d="M964 758h92l-14 80h-64z" fill="#07505f"/>
  </g>
</svg>
