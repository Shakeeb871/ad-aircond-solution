<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="Technician inspecting an outdoor condenser unit with service tools">
  <defs>
    <linearGradient id="wBg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#0e4553"/><stop offset="1" stop-color="#062631"/></linearGradient>
    <linearGradient id="wMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf5f7"/><stop offset="1" stop-color="#b9d3d9"/></linearGradient>
    <linearGradient id="wSuit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14d0c4"/><stop offset="1" stop-color="#0a92a8"/></linearGradient>
    <radialGradient id="wGlow" cx="0.7" cy="0.32" r="0.55"><stop offset="0" stop-color="#5cf0df" stop-opacity="0.32"/><stop offset="1" stop-color="#5cf0df" stop-opacity="0"/></radialGradient>
    <filter id="wSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#wBg)"/>
