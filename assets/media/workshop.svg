    <path d="M232 470c-56 12-90 56-98 116l-18 122c-3 18 10 32 28 32h42l10-104 12 116h136l14-138 16 126h42c18 0 30-16 26-34l-32-134c-14-58-48-94-100-102z" fill="url(#wSuit)"/>
