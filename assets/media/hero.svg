<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Technician servicing a wall-mounted split air conditioner">
  <defs>
    <linearGradient id="hRoom" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0b3542"/><stop offset="0.5" stop-color="#0c4658"/><stop offset="1" stop-color="#062430"/>
    </linearGradient>
    <linearGradient id="hUnit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#e7f4f7"/><stop offset="1" stop-color="#bdd8df"/>
    </linearGradient>
    <linearGradient id="hFlow" x1="1" y1="0" x2="0" y2="0.7">
      <stop offset="0" stop-color="#8ffff2" stop-opacity="0.8"/><stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3a48"/><stop offset="1" stop-color="#051b24"/>
    </linearGradient>
    <linearGradient id="hSuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ad6c6"/><stop offset="1" stop-color="#0a92ad"/>
    </linearGradient>
    <radialGradient id="hGlow" cx="0.63" cy="0.34" r="0.42">
      <stop offset="0" stop-color="#5ff2e2" stop-opacity="0.36"/><stop offset="1" stop-color="#5ff2e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hGlow2" cx="0.18" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#0e7f96" stop-opacity="0.45"/><stop offset="1" stop-color="#0e7f96" stop-opacity="0"/>
    </radialGradient>
    <filter id="hBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="hSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#hRoom)"/>
  <rect width="1600" height="1000" fill="url(#hGlow2)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <path d="M300 0V780M640 0V780M980 0V780M1320 0V780"/>
  </g>

  <path d="M0 780h1600v220H0z" fill="url(#hFloor)"/>
  <path d="M0 780h1600v5H0z" fill="#ffffff" fill-opacity="0.09"/>

  <ellipse cx="1010" cy="340" rx="440" ry="300" fill="url(#hGlow)"/>

  <!-- airflow streaming left out of the unit -->
  <g fill="none" stroke="url(#hFlow)" stroke-linecap="round">
    <path d="M900 372C770 340 640 344 500 380" stroke-width="10" opacity="0.85"/>
    <path d="M900 404C726 384 552 412 392 476" stroke-width="7.5" opacity="0.58"/>
    <path d="M900 436C716 448 536 512 384 606" stroke-width="5.5" opacity="0.36"/>
    <path d="M900 342C820 318 736 314 654 328" stroke-width="5.5" opacity="0.48"/>
  </g>

  <!-- split indoor unit (approx 2.1 m above the floor) -->
  <g>
    <rect x="904" y="344" width="214" height="78" rx="19" fill="#031c25" opacity="0.5" filter="url(#hSoft)"/>
    <rect x="900" y="334" width="214" height="78" rx="18" fill="url(#hUnit)"/>
    <rect x="900" y="334" width="214" height="78" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M916 386h182" stroke="#a9c6ce" stroke-width="3" stroke-linecap="round"/>
    <path d="M922 398h170a11 11 0 0 0 9-15H913a11 11 0 0 0 9 15z" fill="#dbecf0"/>
    <circle cx="1090" cy="360" r="5" fill="#14bdb8"/>
    <rect x="920" y="354" width="46" height="7" rx="3.5" fill="#d5e8ec"/>
  </g>

  <!-- step ladder -->
  <g stroke="#0d6577" stroke-width="9" stroke-linecap="round" opacity="0.8">
    <path d="M946 780V470M1036 780V470"/>
    <path d="M953 712h76M958 640h72M963 568h68"/>
  </g>

  <!-- technician (~1.7 m tall against the 2.1 m unit height) -->
  <g>
    <ellipse cx="1180" cy="786" rx="86" ry="13" fill="#02141b" opacity="0.6" filter="url(#hBlur)"/>

    <!-- legs -->
    <path d="M1146 690h30v92h-30zM1186 690h30v92h-30z" fill="#0b2f3c"/>
    <path d="M1138 776h44v14h-44zM1180 776h44v14h-44z" fill="#071e27"/>

    <!-- torso -->
    <path d="M1180 560c-34 0-56 20-60 52l-10 66c-1 10 6 18 16 18h108c10 0 17-8 16-18l-10-66c-4-32-26-52-60-52z" fill="url(#hSuit)"/>
    <path d="M1134 660h92" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" stroke-linecap="round"/>
    <path d="M1180 560v82" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

    <!-- raised arm reaching to the unit -->
    <path d="M1148 578 1102 440" fill="none" stroke="url(#hSuit)" stroke-width="21" stroke-linecap="round"/>
    <circle cx="1098" cy="430" r="13" fill="#eed7c0"/>

    <!-- lower arm holding a cloth -->
    <path d="M1222 586c20 12 30 32 32 54" fill="none" stroke="url(#hSuit)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="1256" cy="648" r="12.5" fill="#eed7c0"/>
    <rect x="1240" y="656" width="36" height="22" rx="7" fill="#9fe6e0" opacity="0.9"/>

    <!-- head turned toward the unit -->
    <circle cx="1180" cy="524" r="31" fill="#eed7c0"/>
    <path d="M1149 518c1-22 15-36 33-36s33 13 34 35c-10-8-24-11-36-7-13 4-22 5-31 8z" fill="#0b3947"/>
    <path d="M1146 515h70v9h-70z" fill="#0b3947"/>
    <circle cx="1164" cy="528" r="2.6" fill="#0b3947" opacity="0.75"/>
    <path d="M1168 552h24v10h-24z" fill="#eed7c0"/>
  </g>

  <!-- toolbox -->
  <g>
    <rect x="1322" y="724" width="120" height="58" rx="11" fill="#0d6d80"/>
    <rect x="1322" y="724" width="120" height="18" rx="9" fill="#14bdb8"/>
    <rect x="1364" y="708" width="38" height="11" rx="5.5" fill="none" stroke="#14bdb8" stroke-width="6"/>
  </g>

  <!-- plant, far left -->
  <g opacity="0.5">
    <path d="M170 780v-86" stroke="#0d6577" stroke-width="9"/>
    <path d="M170 704c-40-14-56-52-52-92 40 6 62 42 52 92zM170 694c40-18 52-58 44-96-40 10-58 46-44 96z" fill="#0f8093"/>
    <path d="M134 778h72l-10 62h-52z" fill="#0a4453"/>
  </g>
</svg>
